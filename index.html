<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotom Dex - Guilda Ragnarok</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bibliotecas para PDF e Imagem -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* TEMA POKÉMON PC GAMER - DARK MODE */
        :root {
            --poke-red: #E3350D;
            --poke-dark-red: #8B0000;
            --poke-blue: #3164b4;
            --poke-dark-blue: #1c3c6b;
            --poke-yellow: #FFCC00;
            --bg-dark: #0f172a; 
            --panel-bg: #1e293b; 
            --panel-inner: #0b1120; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --glass: rgba(30, 41, 59, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(59, 130, 246, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(59, 130, 246, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            padding: 20px; 
            color: var(--text-main);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(227, 53, 13, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 50% 100%, rgba(49, 100, 180, 0.15) 0%, transparent 50%);
            z-index: -2;
            pointer-events: none;
        }

        /* POKÉMONS DECORATIVOS NO FUNDO */
        .bg-pokemon {
            position: fixed;
            z-index: -1;
            opacity: 0.8;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(0,0,0,0.5));
        }
        
        @keyframes float-1 { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(2deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        @keyframes float-2 { 0% { transform: translateY(0px) scaleX(-1) rotate(0deg); } 50% { transform: translateY(-15px) scaleX(-1) rotate(-2deg); } 100% { transform: translateY(0px) scaleX(-1) rotate(0deg); } }
        @keyframes float-3 { 0% { transform: translateY(0px) scaleX(-1) rotate(0deg); } 50% { transform: translateY(-25px) scaleX(-1) rotate(3deg); } 100% { transform: translateY(0px) scaleX(-1) rotate(0deg); } }
        @keyframes float-4 { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-18px) rotate(-2deg); } 100% { transform: translateY(0px) rotate(0deg); } }

        .poke-1 { bottom: 5%; left: 3%; width: 220px; animation: float-1 6s ease-in-out infinite; }
        .poke-2 { top: 5%; right: 3%; width: 180px; animation: float-2 7s ease-in-out infinite; animation-delay: -1s; }
        .poke-3 { bottom: 5%; right: 5%; width: 120px; animation: float-3 5s ease-in-out infinite; animation-delay: -2s; }
        .poke-4 { top: 8%; left: 5%; width: 150px; animation: float-4 8s ease-in-out infinite; animation-delay: -3s; }

        /* CONTAINER PRINCIPAL */
        .dex-container {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%; 
            max-width: 900px; 
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255,255,255,0.1);
            border: 2px solid var(--border-color);
            display: flex; 
            flex-direction: column;
            max-height: 90vh;
            position: relative;
            overflow: hidden;
            z-index: 10;
        }

        /* HEADER ROTOM */
        .dex-header {
            background: linear-gradient(135deg, var(--poke-dark-red), var(--poke-red));
            padding: 20px; 
            text-align: center; 
            color: white;
            border-bottom: 4px solid #000;
            position: relative; 
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        
        .dex-lights {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .cam-lens {
            width: 40px; height: 40px; border-radius: 50%; 
            background: radial-gradient(circle at 30% 30%, #a8c0ff, #1c3c6b);
            border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .mini-light {
            width: 12px; height: 12px; border-radius: 50%; border: 1px solid #000;
        }
        .l-red { background: #ff4d4d; box-shadow: 0 0 5px #ff4d4d; }
        .l-yellow { background: #facc15; box-shadow: 0 0 5px #facc15; }
        .l-green { background: #4ade80; box-shadow: 0 0 5px #4ade80; }

        .dex-header h1 { 
            font-size: 1.8rem; 
            font-weight: 700; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); 
            font-family: 'Press Start 2P', cursive; 
            color: var(--poke-yellow);
            -webkit-text-stroke: 1px #000;
            margin: 0;
            padding: 10px 0;
        }

        /* CONTEÚDO SCROLLÁVEL */
        .dex-body {
            padding: 30px;
            overflow-y: auto;
            flex-grow: 1;
            background: var(--panel-inner);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .dex-body::-webkit-scrollbar { width: 8px; }
        .dex-body::-webkit-scrollbar-track { background: var(--bg-dark); }
        .dex-body::-webkit-scrollbar-thumb { background: var(--poke-red); border-radius: 10px; }

        /* ABAS (TABS) */
        .tabs {
            display: flex; 
            gap: 10px;
            background: var(--panel-bg);
            border-radius: 12px; 
            padding: 8px; 
            border: 1px solid var(--border-color);
        }
        .tab-btn {
            flex: 1; 
            background: transparent; border: 2px solid transparent;
            padding: 12px 10px; font-size: 0.85rem; font-weight: 700;
            color: var(--text-muted); border-radius: 8px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tab-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .tab-btn.active { 
            background: var(--poke-blue); 
            color: white; 
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); 
        }

        /* GRID PARA PC */
        .split-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            align-items: start;
        }
        @media (max-width: 850px) {
            .bg-pokemon { display: none; } 
            .split-layout { grid-template-columns: 1fr; }
            .dex-header h1 { font-size: 1.2rem; }
            .cam-lens { width: 30px; height: 30px; }
            .dex-lights { left: 10px; gap: 5px; }
            .mini-light { display: none; } 
        }

        /* CONTAINERS INTERNOS */
        .section-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .section-title {
            font-size: 0.9rem;
            color: var(--poke-yellow);
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title::after {
            content: ''; flex: 1; height: 2px; background: var(--border-color);
        }

        /* INPUTS MODERNOS DARK */
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .input-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
        .input-control {
            padding: 12px 15px; border: 2px solid var(--border-color); border-radius: 10px;
            font-size: 0.9rem; font-weight: 500; background: var(--panel-inner);
            transition: all 0.2s; width: 100%; color: var(--text-main); outline: none;
        }
        .input-control:focus { border-color: var(--poke-yellow); box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.1); }
        
        .file-drop-area {
            position: relative; 
            z-index: 10;        
            border: 2px dashed var(--poke-blue); border-radius: 12px; padding: 25px;
            text-align: center; background: rgba(59, 130, 246, 0.05); cursor: pointer; transition: 0.2s;
            margin-bottom: 15px;
        }
        .file-drop-area:hover { border-color: var(--poke-yellow); background: rgba(250, 204, 21, 0.05); }
        .file-drop-area input[type="file"] { 
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; z-index: 11;
        }
        .file-label { color: var(--poke-blue); font-weight: 700; font-size: 0.9rem; display: block; margin-bottom: 5px; }

        /* GRID DA HUNT */
        .hunt-grid { display: flex; flex-direction: column; gap: 10px; }
        .hunt-row {
            display: grid; grid-template-columns: 2fr 1.5fr auto; gap: 10px; align-items: center;
            background: var(--panel-inner); padding: 10px; border-radius: 10px; border: 1px solid var(--border-color);
        }
        .lurer-container { display: flex; flex-direction: column; align-items: center; font-size: 0.6rem; font-weight: 600; color: #f87171; }
        .lurer-check {
            appearance: none; -webkit-appearance: none;
            width: 24px; height: 24px; border: 2px solid var(--border-color); border-radius: 6px;
            cursor: pointer; position: relative; transition: 0.2s; background: var(--panel-bg);
        }
        .lurer-check:checked { background: var(--poke-red); border-color: var(--poke-red); box-shadow: 0 0 10px var(--poke-red); }
        .lurer-check:checked::after {
            content: '✔'; position: absolute; color: white;
            font-size: 16px; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        /* BOTOES 3D DARK */
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            flex: 1; border: none; padding: 14px; font-size: 0.85rem; font-weight: 700;
            border-radius: 10px; cursor: pointer; color: white; text-transform: uppercase;
            transition: all 0.1s; position: relative; letter-spacing: 1px;
        }
        .btn-calc { background: var(--poke-blue); box-shadow: 0 4px 0px var(--poke-dark-blue); }
        .btn-calc:hover { filter: brightness(1.1); }
        .btn-clear { background: transparent; border: 2px solid var(--text-muted); color: var(--text-muted); }
        .btn-clear:hover { background: rgba(255,255,255,0.05); color: white; border-color: white; }
        
        .export-actions { display: none; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn-img { background: #10b981; box-shadow: 0 4px 0px #047857; width: 100%; display: block; }
        .btn-pdf { background: #dc2626; box-shadow: 0 4px 0px #7f1d1d; width: 100%; display: block; }
        .btn-img:hover, .btn-pdf:hover { filter: brightness(1.1); }
        
        .btn:active { transform: translateY(4px); box-shadow: none !important; }

        /* AREA DE RESULTADOS */
        .results-container { margin-top: 20px; display: none; }
        .team-card {
            background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 20px; margin-bottom: 15px; position: relative; overflow: hidden;
        }
        .team-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--poke-blue);
        }
        .team-card h4 { color: var(--poke-yellow); font-size: 1.1rem; margin-bottom: 15px; padding-bottom: 5px; border-bottom: 1px solid var(--border-color); }
        .team-card ul { list-style: none; font-size: 0.9rem; margin-bottom: 15px; }
        .team-card li { padding: 6px 0; display: flex; justify-content: space-between; border-bottom: 1px dashed var(--border-color); }
        
        .status-badge { display: inline-block; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 0.8rem; letter-spacing: 0.5px;}
        .status-ok { background: rgba(74, 222, 128, 0.1); color: #4ade80; border: 1px solid #047857; }
        .status-fail { background: rgba(248, 113, 113, 0.1); color: #f87171; border: 1px solid #991b1b; }

        /* TABELA DARK PARA PDF E VISUALIZAÇÃO */
        .table-container { overflow-x: auto; background: var(--panel-bg); border-radius: 12px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; text-align: center; }
        th { background: #0f172a; color: var(--poke-yellow); padding: 15px 8px; font-weight: 700; border-bottom: 2px solid var(--border-color); text-transform: uppercase; letter-spacing: 1px;}
        td { padding: 12px 8px; border-bottom: 1px solid var(--border-color); color: var(--text-main); font-weight: 500;}
        tr:last-child td { border-bottom: none; }
        tr { page-break-inside: avoid; background-color: var(--panel-bg); transition: 0.2s; }
        tr:nth-child(even) { background-color: rgba(255,255,255,0.02); }
        tr:hover { background-color: rgba(59, 130, 246, 0.1); }
        
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: var(--text-muted); font-size: 0.75rem; font-weight: 600;}
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); margin: 0 10px; }

        #conteudo-pdf { background-color: var(--panel-inner); padding: 20px; border-radius: 8px; color: var(--text-main); }
        #conteudo-pdf h3 { color: var(--poke-yellow); }
    </style>
</head>
<body onload="limparDados()">

<!-- Pokémons no fundo da tela com animações divertidas -->
<img src="https://play.pokemonshowdown.com/sprites/ani/charizard.gif" class="bg-pokemon poke-1" alt="Charizard">
<img src="https://play.pokemonshowdown.com/sprites/ani/gengar.gif" class="bg-pokemon poke-2" alt="Gengar" style="transform: scaleX(-1)">
<img src="https://play.pokemonshowdown.com/sprites/ani/pikachu.gif" class="bg-pokemon poke-3" alt="Pikachu">
<img src="https://play.pokemonshowdown.com/sprites/ani/dragonite.gif" class="bg-pokemon poke-4" alt="Dragonite">

<div class="dex-container">
    
    <div class="dex-header">
        <div class="dex-lights">
            <div class="cam-lens"></div>
            <div class="mini-light l-red"></div>
            <div class="mini-light l-yellow"></div>
            <div class="mini-light l-green"></div>
        </div>
        <div>
            <h1>GUILDA RAGNAROK</h1>
        </div>
    </div>

    <div class="dex-body">
        
        <div class="tabs">
            <button class="tab-btn active" id="btn-3x3" onclick="setMode('3x3')">MODO 3x3</button>
            <button class="tab-btn" id="btn-2x2" onclick="setMode('2x2')">MODO 2x2</button>
            <button class="tab-btn" id="btn-contrib" onclick="setMode('contrib')">CONTRIBUIÇÃO</button>
        </div>

        <!-- SEÇÃO DE HUNT -->
        <div id="hunt-section">
            <div class="section-title">CONFIGURAR TIME DE CAÇA</div>
            <p id="hunt-help" style="font-size: 0.8rem; margin-bottom: 15px; color: var(--text-muted);">
                Preencha os 6 membros e marque <strong>2 Lurers</strong>. Dano em formato (k).
            </p>
            
            <div class="hunt-grid" id="hunt-grid">
                <script>
                    for(let i = 1; i <= 6; i++) {
                        document.write(`
                            <div class="hunt-row">
                                <input type="text" class="input-control" id="nome${i}" placeholder="P${i} Nickname">
                                <input type="number" class="input-control" id="dano${i}" placeholder="Dano (ex: 250)">
                                <div class="lurer-container">
                                    <input type="checkbox" id="lurer${i}" class="lurer-check" onchange="checkLurerLimit(this)">
                                    <span>Lurer</span>
                                </div>
                            </div>
                        `);
                    }
                </script>
            </div>
            
            <div class="actions">
                <button class="btn btn-clear" onclick="limparDados()">Resetar</button>
                <button class="btn btn-calc" onclick="calcularHunt()">Balancear Times</button>
            </div>
        </div>

        <!-- SEÇÃO DE CONTRIBUIÇÃO -->
        <div id="contrib-section" style="display: none;">
            
            <div class="split-layout">
                <!-- Coluna Esquerda: Leitura Automática -->
                <div class="section-panel">
                    <div class="section-title">Análise de Planilha</div>
                    
                    <div class="input-group">
                        <label>Selecionar Meta</label>
                        <select id="guilda-selecionada" class="input-control">
                            <option value="8400">Ragnarok Principal (8400)</option>
                            <option value="5400">Ragnarok Academy (5400)</option>
                        </select>
                    </div>

                    <div class="file-drop-area">
                        <input type="file" id="json-file" accept=".json">
                        <span class="file-label">📥 Upload de JSON</span>
                        <span style="font-size:0.75rem; color:var(--text-muted)">Arraste o arquivo ou clique</span>
                    </div>
                </div>

                <!-- Coluna Direita: Manual -->
                <div class="section-panel">
                    <div class="section-title">Cálculo Individual</div>
                    
                    <div class="input-group">
                        <label>Nickname</label>
                        <input type="text" id="nick" class="input-control" placeholder="Seu Nick no jogo">
                    </div>
                    
                    <div style="display:flex; gap:10px;">
                        <div class="input-group" style="flex:1;">
                            <label>💰 Donate (R$)</label>
                            <input type="number" id="donate" class="input-control" placeholder="0" value="0">
                        </div>
                        <div class="input-group" style="flex:1;">
                            <label>📜 Pontos</label>
                            <input type="number" id="pontos" class="input-control" placeholder="0" value="0">
                        </div>
                    </div>

                    <div class="actions" style="margin-top: 20px;">
                        <button class="btn btn-clear" onclick="limparDados()">Limpar</button>
                        <button class="btn btn-calc" onclick="calcularContrib()">Simular</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- AREA DE RESULTADOS GERAIS -->
        <div id="results" class="results-container"></div>
        
        <!-- BOTOES DE EXPORTAÇÃO -->
        <div class="export-actions" id="export-actions">
            <button class="btn btn-pdf" onclick="gerarPDF()">📄 BAIXAR COMO PDF</button>
            <button class="btn btn-img" onclick="gerarImagem()">📸 BAIXAR COMO IMAGEM</button>
        </div>

    </div>
</div>

<script>
    let currentMode = '3x3';

    function setMode(mode) {
        currentMode = mode;
        
        document.getElementById('btn-3x3').classList.toggle('active', mode === '3x3');
        document.getElementById('btn-2x2').classList.toggle('active', mode === '2x2');
        document.getElementById('btn-contrib').classList.toggle('active', mode === 'contrib');
        
        const isHunt = mode === '3x3' || mode === '2x2';
        document.getElementById('hunt-section').style.display = isHunt ? 'block' : 'none';
        document.getElementById('contrib-section').style.display = mode === 'contrib' ? 'block' : 'none';
        
        if (isHunt) {
            const helpText = document.getElementById('hunt-help');
            if (mode === '3x3') {
                helpText.innerHTML = "Preencha os 6 membros e marque exatamente <strong>2 Lurers</strong>. Dano em formato (k).";
            } else {
                helpText.innerHTML = "Preencha os 6 membros e marque exatamente <strong>3 Lurers</strong>. Dano em formato (k).";
            }
            document.querySelectorAll('.lurer-check').forEach(cb => cb.checked = false);
        }

        document.getElementById('results').style.display = 'none';
        document.getElementById('export-actions').style.display = 'none';
    }

    function checkLurerLimit(checkbox) {
        const maxLurers = currentMode === '3x3' ? 2 : 3;
        const checkboxes = document.querySelectorAll('.lurer-check');
        let count = 0;
        
        checkboxes.forEach(cb => { if (cb.checked) count++; });
        
        if (count > maxLurers) {
            checkbox.checked = false;
            alert(`Atenção! Você só pode selecionar ${maxLurers} Lurers no Modo ${currentMode}.`);
        }
    }

    function limparDados() {
        for(let i = 1; i <= 6; i++) {
            const nomeInput = document.getElementById(`nome${i}`);
            const danoInput = document.getElementById(`dano${i}`);
            const lurerCheck = document.getElementById(`lurer${i}`);
            
            if(nomeInput) nomeInput.value = '';
            if(danoInput) danoInput.value = '';
            if(lurerCheck) lurerCheck.checked = false;
        }
        
        document.getElementById('nick').value = '';
        document.getElementById('donate').value = '0';
        document.getElementById('pontos').value = '0';
        document.getElementById('json-file').value = '';
        document.getElementById('results').style.display = 'none';
        document.getElementById('export-actions').style.display = 'none';
    }

    function calcularHunt() {
        const pokes = [];
        let lurerCount = 0;
        
        for (let i = 1; i <= 6; i++) {
            const nome = document.getElementById(`nome${i}`).value || `Slot ${i}`;
            const dano = parseFloat(document.getElementById(`dano${i}`).value) || 0;
            const isLurer = document.getElementById(`lurer${i}`).checked;
            if (isLurer) lurerCount++;
            pokes.push({ nome, dano, isLurer });
        }

        const lurers = pokes.filter(p => p.isLurer);
        const nonLurers = pokes.filter(p => !p.isLurer);
        const res = document.getElementById('results');
        let html = '';

        if (currentMode === '3x3') {
            if (lurerCount !== 2) { alert('Selecione exatamente 2 Lurers para gerar os trios.'); return; }
            
            let bestDiff = Infinity; let bestTeam1 = [], bestTeam2 = [];
            
            const combs = [[0,1], [0,2], [0,3], [1,2], [1,3], [2,3]];
            for (let c of combs) {
                const t1_nl = [nonLurers[c[0]], nonLurers[c[1]]];
                const t2_nl = nonLurers.filter((_, idx) => !c.includes(idx));

                const dmg1 = lurers[0].dano + t1_nl[0].dano + t1_nl[1].dano;
                const dmg2 = lurers[1].dano + t2_nl[0].dano + t2_nl[1].dano;
                const diff = Math.abs(dmg1 - dmg2);

                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestTeam1 = [lurers[0], ...t1_nl];
                    bestTeam2 = [lurers[1], ...t2_nl];
                }
            }

            html += `<h3 class="section-title">RESULTADO: TIMES (3x3)</h3>`;
            html += `<div class="split-layout">`;
            html += renderTeam(bestTeam1, "Trio 1 (Líder: " + lurers[0].nome + ")", '3x3');
            html += renderTeam(bestTeam2, "Trio 2 (Líder: " + lurers[1].nome + ")", '3x3');
            html += `</div>`;

        } else if (currentMode === '2x2') {
            if (lurerCount !== 3) { alert('Selecione exatamente 3 Lurers para gerar as duplas.'); return; }
            
            let bestDiff = Infinity; let bestTeams = [];
            
            const perms = [[0,1,2], [0,2,1], [1,0,2], [1,2,0], [2,0,1], [2,1,0]];
            for (let p of perms) {
                const dmg1 = lurers[0].dano + nonLurers[p[0]].dano;
                const dmg2 = lurers[1].dano + nonLurers[p[1]].dano;
                const dmg3 = lurers[2].dano + nonLurers[p[2]].dano;

                const maxDmg = Math.max(dmg1, dmg2, dmg3);
                const minDmg = Math.min(dmg1, dmg2, dmg3);
                const diff = maxDmg - minDmg;

                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestTeams = [
                        [lurers[0], nonLurers[p[0]]],
                        [lurers[1], nonLurers[p[1]]],
                        [lurers[2], nonLurers[p[2]]]
                    ];
                }
            }

            html += `<h3 class="section-title">RESULTADO: TIMES (2x2)</h3>`;
            html += renderTeam(bestTeams[0], "Dupla 1 (Líder: " + lurers[0].nome + ")", '2x2');
            html += renderTeam(bestTeams[1], "Dupla 2 (Líder: " + lurers[1].nome + ")", '2x2');
            html += renderTeam(bestTeams[2], "Dupla 3 (Líder: " + lurers[2].nome + ")", '2x2');
        }

        res.innerHTML = html;
        res.style.display = 'block';
    }

    // Função RenderTeam adaptada para Dano Base e cálculo de faltas
    function renderTeam(team, title, mode) {
        let dmgBase = team.reduce((sum, p) => sum + p.dano, 0);
        
        // Tabela oficial de Hazard
        const hazards = [
            { level: 0, dmg: 560 },
            { level: 5, dmg: 650 },
            { level: 10, dmg: 715 },
            { level: 11, dmg: 730 },
            { level: 12, dmg: 740 },
            { level: 13, dmg: 755 },
            { level: 14, dmg: 765 },
            { level: 15, dmg: 780 },
            { level: 17, dmg: 845 }
        ];

        let currentHazard = null;
        let nextHazards = [];

        // Descobre o hazard atual e os que faltam
        for (let i = 0; i < hazards.length; i++) {
            if (dmgBase >= hazards[i].dmg) {
                currentHazard = hazards[i];
            } else {
                nextHazards.push(hazards[i]);
            }
        }

        let html = `<div class="team-card">`;
        html += `<h4>${title}</h4>`;
        html += `<ul>`;
        team.forEach(p => {
            html += `<li><span>${p.isLurer ? '🎯 <b style="color:#ef4444">Lurer</b>' : '⚔️ <b style="color:var(--poke-blue)">Ataque</b>'} - ${p.nome}</span> <span>${p.dano}</span></li>`;
        });
        html += `</ul>`;
        
        // Card do Dano Atual
        html += `<div style="background: rgba(0,0,0,0.2); padding: 12px; border-radius: 8px; margin-bottom:15px; border: 1px solid var(--border-color);">`;
        html += `<div style="display:flex; justify-content:space-between; color: var(--poke-yellow); font-size: 1rem; margin-bottom: 8px;"><strong>Dano do Time:</strong> <span>${dmgBase.toFixed(1)}k</span></div>`;

        if (currentHazard !== null) {
            html += `<div class="status-badge status-ok" style="width:100%; text-align:center; font-size:0.9rem;">🏆 Pode caçar: Hazard ${currentHazard.level}</div>`;
        } else {
            html += `<div class="status-badge status-fail" style="width:100%; text-align:center; font-size:0.9rem;">❌ Não pode caçar (Mínimo: 560k)</div>`;
        }
        html += `</div>`;

        // Lista do que falta
        if (nextHazards.length > 0) {
            html += `<div style="font-size: 0.8rem; background: var(--panel-inner); padding: 10px; border-radius: 8px;">`;
            html += `<div style="color: var(--text-muted); margin-bottom: 5px; font-weight: bold;">Dano faltando para:</div>`;
            nextHazards.forEach(h => {
                let falta = (h.dmg - dmgBase).toFixed(1);
                html += `<div style="display:flex; justify-content:space-between; padding: 4px 0; border-bottom: 1px dashed var(--border-color);"><span>Hazard ${h.level} (${h.dmg}k)</span> <span style="color:#f87171; font-weight:bold;">-${falta}k</span></div>`;
            });
            html += `</div>`;
        } else {
             html += `<div style="font-size: 0.8rem; background: var(--panel-inner); padding: 10px; border-radius: 8px; text-align:center; color:#4ade80; font-weight:bold;">🔥 Dano Máximo Atingido!</div>`;
        }

        html += `</div>`;
        return html;
    }

    document.getElementById('json-file').addEventListener('change', function(event) {
        if(this.files.length > 0) {
            calcularContrib();
        }
    });

    function calcularSemanaAtual(dateStr) {
        let baseDate = dateStr ? new Date(dateStr.replace(' ', 'T')) : new Date();
        if (isNaN(baseDate)) baseDate = new Date();

        let day = baseDate.getDay(); 
        let diffToMonday = day === 0 ? 6 : day - 1; 
        
        let currentMonday = new Date(baseDate);
        currentMonday.setDate(baseDate.getDate() - diffToMonday);
        
        let currentSunday = new Date(currentMonday);
        currentSunday.setDate(currentMonday.getDate() + 6);

        return {
            inicio: currentMonday.toLocaleDateString('pt-BR'),
            fim: currentSunday.toLocaleDateString('pt-BR')
        };
    }

    function calcularContrib() {
        const fileInput = document.getElementById('json-file');
        
        if (fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    renderJSONTable(data);
                } catch (error) {
                    alert("Erro ao ler o arquivo. Certifique-se de que é um JSON válido.");
                }
            };
            reader.readAsText(file);
        } else {
            calcularContribManual();
        }
    }

    function renderJSONTable(data) {
        const selectGuilda = document.getElementById('guilda-selecionada');
        const meta = parseInt(selectGuilda.value);
        const nomeGuilda = selectGuilda.options[selectGuilda.selectedIndex].text.replace(/[^a-zA-Z0-ões ]/g, "").trim();
        const res = document.getElementById('results');
        
        let listaArray = [];
        if (Array.isArray(data)) listaArray = data;
        else if (data.members && Array.isArray(data.members)) listaArray = data.members;
        else {
            for (let key in data) {
                if (Array.isArray(data[key])) { listaArray = data[key]; break; }
            }
        }

        if (!Array.isArray(listaArray) || listaArray.length === 0) {
            res.innerHTML = `<div class="team-card status-fail" style="text-align:center;">Formato de arquivo inválido.</div>`;
            res.style.display = 'block';
            document.getElementById('export-actions').style.display = 'none';
            return;
        }

        let datasSemana = calcularSemanaAtual(data.exportedAt);

        let html = `<div id="conteudo-pdf" style="background-color: var(--panel-inner); padding: 30px; border-radius: 12px; border: 1px solid var(--border-color); width: 100%;">`;
        
        html += `<div style="text-align: center; margin-bottom: 25px;">`;
        html += `<h3 style="margin-top: 0; color: var(--poke-yellow); font-family: 'Press Start 2P', cursive; font-size: 1rem; margin-bottom:10px;">RELATÓRIO OFICIAL</h3>`;
        html += `<div style="font-size: 1.1rem; color: var(--text-main); font-weight:700; text-transform:uppercase; letter-spacing:1px;">⚔️ ${nomeGuilda} ⚔️</div>`;
        html += `<div style="display:inline-block; margin-top: 10px; font-size: 0.8rem; color: var(--text-muted); background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 6px 15px;">`;
        html += `🗓️ Semanal: <strong>${datasSemana.inicio}</strong> a <strong>${datasSemana.fim}</strong>`;
        html += `</div>`;
        html += `</div>`;

        html += `<div class="table-container"><table>`;
        html += `<tr><th>Nick</th><th>Pontos</th><th>Donate</th><th>Total</th><th>Status</th></tr>`;

        let processados = 0;

        listaArray.forEach(player => {
            // Updated to fetch the explicit exact names you provided: "name", "points", "contribution"
            let nick = player['name'] || player['Name'] || player['Nick'] || player['nick'] || player['Nome'] || "Desconhecido";
            let pontos = parseFloat(player['points'] || player['Points'] || player['Pontos'] || player['pontos'] || player['dailiesCompleted'] || player['Dailys Feitas'] || player['dailys'] || player['Dailys']) || 0;
            let donate = parseFloat(player['contribution'] || player['Contribution'] || player['Donate em R$'] || player['donate'] || player['Donate']) || 0;

            if (!nick || String(nick).trim() === "Desconhecido" || String(nick).includes("COMO PREENCHER")) return;

            processados++;
            const totalFinal = donate + (pontos * 150);
            
            html += `<tr>`;
            html += `<td><strong>${nick}</strong></td>`;
            html += `<td>${pontos}</td>`;
            html += `<td>R$ ${donate.toLocaleString('pt-BR')}</td>`;
            html += `<td style="color:var(--poke-yellow); font-weight:700;">${totalFinal.toLocaleString('pt-BR')}</td>`; 
            
            if (totalFinal >= meta) {
                html += `<td><span class="status-badge status-ok">✅ OK</span></td>`;
            } else {
                html += `<td><span class="status-badge status-fail">⚠️ -${(meta - totalFinal).toLocaleString('pt-BR')}</span></td>`;
            }
            html += `</tr>`;
        });

        html += `</table></div>`;
        html += `<div style="margin-top: 20px; text-align: center; font-size: 0.7rem; color: var(--text-muted); font-weight: 600; letter-spacing: 1px;">SISTEMA GERADO POR ROTOM DEX</div>`;
        html += `</div>`; 

        if (processados === 0) {
            html = `<div class="team-card status-fail" style="text-align:center;">Não foi possível ler as colunas.</div>`;
            document.getElementById('export-actions').style.display = 'none';
        } else {
            document.getElementById('export-actions').style.display = 'flex'; 
        }

        res.innerHTML = html;
        res.style.display = 'block';
    }

    function calcularContribManual() {
        const meta = parseInt(document.getElementById('guilda-selecionada').value);
        const donate = parseFloat(document.getElementById('donate').value) || 0;
        const pontos = parseFloat(document.getElementById('pontos').value) || 0;
        
        const totalPontos = pontos * 150;
        const totalFinal = donate + totalPontos;
        
        const res = document.getElementById('results');
        res.style.display = 'block';
        document.getElementById('export-actions').style.display = 'none';

        let html = `<div class="team-card" style="text-align:center;">`;
        html += `<h4 style="color: var(--poke-yellow); text-transform: uppercase;">Resumo Individual</h4>`;
        html += `<div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px;">Meta Exigida: ${meta}</div>`;
        
        html += `<ul style="text-align:left; max-width: 250px; margin: 0 auto 15px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color);">`;
        html += `<li><span>📜 Por Pontos:</span> <span>${totalPontos}</span></li>`;
        html += `<li><span>💰 Donate:</span> <span>${donate}</span></li>`;
        html += `<li style="font-weight:700; border-top: 2px solid var(--border-color); padding-top: 10px; margin-top:10px; color: var(--poke-yellow);"><span>🏆 TOTAL:</span> <span>${totalFinal}</span></li>`;
        html += `</ul>`;

        if (totalFinal >= meta) {
            html += `<div class="status-badge status-ok" style="font-size: 1.1rem; padding: 10px 20px; width:100%;">✅ Meta atingida!</div>`;
        } else {
            html += `<div class="status-badge status-fail" style="font-size: 1.1rem; padding: 10px 20px; width:100%;">⚠️ Devendo: R$ -${meta - totalFinal}</div>`;
        }
        html += `</div>`;
        res.innerHTML = html;
    }

    function gerarImagem() {
        const element = document.getElementById('conteudo-pdf');
        const tableContainer = element.querySelector('.table-container');
        if(tableContainer) tableContainer.style.overflowX = 'visible';

        const btn = document.querySelector('.btn-img');
        const textOriginal = btn.innerHTML;
        btn.innerHTML = "📸 GERANDO...";
        btn.style.opacity = "0.7";

        element.style.padding = "40px";

        html2canvas(element, { 
            scale: 2, 
            useCORS: true, 
            backgroundColor: '#0b1120'
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'Relatorio_Guilda_Ragnarok.png';
            link.href = canvas.toDataURL('image/png');
            link.click();

            element.style.padding = "30px";
            btn.innerHTML = textOriginal;
            btn.style.opacity = "1";
            if(tableContainer) tableContainer.style.overflowX = 'auto'; 
        }).catch(err => {
            console.error("Erro ao gerar Imagem:", err);
            alert("Erro ao tentar gerar a imagem.");
            element.style.padding = "30px";
            btn.innerHTML = textOriginal;
            btn.style.opacity = "1";
            if(tableContainer) tableContainer.style.overflowX = 'auto';
        });
    }

    function gerarPDF() {
        const element = document.getElementById('conteudo-pdf');
        const tableContainer = element.querySelector('.table-container');
        if(tableContainer) tableContainer.style.overflowX = 'visible';

        const opt = {
            margin:       [10, 10, 10, 10],
            filename:     'Relatorio_Guilda_Ragnarok.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#0b1120' },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
            pagebreak:    { mode: ['avoid-all', 'css', 'legacy'] }
        };

        const btn = document.querySelector('.btn-pdf');
        const textOriginal = btn.innerHTML;
        btn.innerHTML = "📄 GERANDO...";
        btn.style.opacity = "0.7";

        html2pdf().set(opt).from(element).save().then(() => {
            btn.innerHTML = textOriginal;
            btn.style.opacity = "1";
            if(tableContainer) tableContainer.style.overflowX = 'auto'; 
        }).catch(err => {
            console.error("Erro ao gerar PDF:", err);
            alert("Erro ao tentar gerar o PDF.");
            btn.innerHTML = textOriginal;
            btn.style.opacity = "1";
            if(tableContainer) tableContainer.style.overflowX = 'auto';
        });
    }
</script>
