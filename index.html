<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guilda Ragnarok - Sistema Balanceador</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(180deg, #cc0000 0%, #cc0000 50%, #ffffff 50%, #ffffff 100%);
            background-attachment: fixed;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .pokedex {
            background-color: #ff0000;
            border: 10px solid #8b0000;
            border-radius: 20px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6);
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        .screen {
            background-color: #2b2b2b;
            border: 8px solid #b3b3b3;
            border-radius: 10px;
            padding: 20px;
            color: #fff;
        }
        .header {
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            color: #ffcb05;
            text-shadow: 2px 2px #3b4cca;
            margin-bottom: 25px;
        }
        .header h1 { font-size: 1.2rem; line-height: 1.5; margin-bottom: 5px; }
        .tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #3b4cca;
            color: white;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            padding: 12px 15px;
            border: 3px solid #1a1a1a;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
            flex: 1;
            min-width: 120px;
        }
        .tab-btn.active {
            background-color: #ffcb05;
            color: #3b4cca;
            border-color: #c7a000;
        }
        
        .grid-hunt {
            display: grid;
            grid-template-columns: auto 2.5fr 1fr auto;
            gap: 10px;
            margin-bottom: 15px;
            align-items: center;
        }
        .grid-contrib {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        .grid-header {
            font-weight: bold;
            color: #ffcb05;
            text-align: center;
            border-bottom: 2px solid #ffcb05;
            padding-bottom: 5px;
            font-size: 0.8rem;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 2px solid #555;
            border-radius: 5px;
            background-color: #444;
            color: #fff;
            font-weight: bold;
            text-align: center;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        input::placeholder { color: #999; }
        .lurer-check {
            width: 25px;
            height: 25px;
            cursor: pointer;
            accent-color: #ffcb05;
        }
        .player-label {
            text-align: center;
            font-weight: bold;
            color: #fff;
            font-size: 0.8rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #ffcb05;
            font-weight: bold;
            text-align: left;
        }
        .actions {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .btn {
            flex: 1;
            padding: 15px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            border: 3px solid #1a1a1a;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-calc { background-color: #4caf50; color: white; }
        .btn-clear { background-color: #f44336; color: white; }
        .btn:active { transform: scale(0.95); }
        
        .results-box {
            margin-top: 20px;
            background-color: #98cb98;
            border: 4px solid #1a1a1a;
            border-radius: 8px;
            padding: 15px;
            color: #1a1a1a;
            font-weight: bold;
            display: none;
        }
        .result-line {
            margin: 10px 0;
            padding-bottom: 10px;
            border-bottom: 2px dashed #666;
        }
        .result-line:last-child { border: none; padding-bottom: 0; margin-bottom: 0; }
        .pass { color: #006600; font-weight: bold; }
        .fail { color: #cc0000; font-weight: bold; }
        .highlight { color: #0000ff; font-size: 1.1rem;}

        .team-card {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #3b4cca;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            color: #1a1a1a;
        }

        @media (max-width: 450px) {
            .grid-hunt { grid-template-columns: 1fr; gap: 5px; }
            .grid-header { display: none; }
            .player-label { text-align: left; margin-top: 10px; color: #ffcb05; font-size: 1rem; }
        }
    </style>
</head>
<body onload="limparDados()">

<div class="pokedex">
    <div class="screen">
        <div class="header">
            <h1>🛡️ GUILDA RAGNAROK 🛡️</h1>
            <p style="font-size: 0.7rem; color: #fff; text-shadow: none;">Sistema Balanceador</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="btn-3x3" onclick="setMode('3x3')">MODO 3x3</button>
            <button class="tab-btn" id="btn-2x2" onclick="setMode('2x2')">MODO 2x2</button>
            <button class="tab-btn" id="btn-contrib" onclick="setMode('contrib')">CONTRIB. DA GUILDA</button>
        </div>

        <!-- SEÇÃO DE HUNT (BALANCEADOR 6 POKÉMONS) -->
        <div id="hunt-section">
            <div id="hunt-help" style="font-size: 0.8rem; text-align: center; margin-bottom: 15px; color: #ccc;">
                Preencha 6 Pokémons e marque exatamente <strong>2 Lurers</strong>.
            </div>
            
            <div class="grid-hunt" id="hunt-grid">
                <div class="grid-header">Slot</div>
                <div class="grid-header">Nome Pokémon</div>
                <div class="grid-header">Dano</div>
                <div class="grid-header">Lurer</div>
                
                <!-- GERANDO OS 6 CAMPOS -->
                <script>
                    for(let i = 1; i <= 6; i++) {
                        document.write(`
                            <div class="player-label">P${i}</div>
                            <div><input type="text" id="nome${i}" placeholder="Nome ${i}"></div>
                            <div><input type="number" id="dano${i}" placeholder="Dano"></div>
                            <div style="text-align: center;">
                                <input type="checkbox" id="lurer${i}" class="lurer-check" onchange="checkLurerLimit(this)">
                            </div>
                        `);
                    }
                </script>
            </div>
            
            <div class="actions">
                <button class="btn btn-clear" onclick="limparDados()">ZERAR TUDO</button>
                <button class="btn btn-calc" onclick="calcularHunt()">CALCULAR TIMES</button>
            </div>
        </div>

        <!-- SEÇÃO DE CONTRIBUIÇÃO -->
        <div id="contrib-section" style="display: none;">
            <div style="font-size: 0.8rem; text-align: center; margin-bottom: 15px; color: #ccc;">
                Meta da Guilda: 5400 <br> (Cada Daily = 300)
            </div>
            <div class="grid-contrib">
                <div class="input-group">
                    <label>👤 Nick (Opcional):</label>
                    <input type="text" id="nick" placeholder="Seu Nick no jogo">
                </div>
                <div class="input-group">
                    <label>💰 Donate em R$ (Opcional):</label>
                    <input type="number" id="donate" placeholder="Ex: 1000" value="0">
                </div>
                <div class="input-group">
                    <label>📜 Dailys Feitas:</label>
                    <input type="number" id="dailys" placeholder="Quantidade de Dailys" value="0">
                </div>
            </div>

            <div class="actions">
                <button class="btn btn-clear" onclick="limparDados()">ZERAR TUDO</button>
                <button class="btn btn-calc" onclick="calcularContrib()">SIMULAR META</button>
            </div>
        </div>

        <!-- RESULTADOS -->
        <div id="results" class="results-box"></div>
    </div>
</div>

<script>
    let currentMode = '3x3';

    function setMode(mode) {
        currentMode = mode;
        
        document.getElementById('btn-3x3').classList.toggle('active', mode === '3x3');
        document.getElementById('btn-2x2').classList.toggle('active', mode === '2x2');
        document.getElementById('btn-contrib').classList.toggle('active', mode === 'contrib');
        
        const isHunt = mode === '3x3' || mode === '2x2';
        document.getElementById('hunt-section').style.display = isHunt ? 'block' : 'none';
        document.getElementById('contrib-section').style.display = mode === 'contrib' ? 'block' : 'none';
        
        if (isHunt) {
            const helpText = document.getElementById('hunt-help');
            if (mode === '3x3') {
                helpText.innerHTML = "Preencha 6 Pokémons e marque exatamente <strong>2 Lurers</strong>.";
            } else {
                helpText.innerHTML = "Preencha 6 Pokémons e marque exatamente <strong>3 Lurers</strong>.";
            }
            
            // Limpa as marcações de Lurer ao trocar de aba para evitar bugs
            document.querySelectorAll('.lurer-check').forEach(cb => cb.checked = false);
        }

        document.getElementById('results').style.display = 'none';
    }

    function checkLurerLimit(checkbox) {
        const maxLurers = currentMode === '3x3' ? 2 : 3;
        const checkboxes = document.querySelectorAll('.lurer-check');
        let count = 0;
        
        checkboxes.forEach(cb => { if (cb.checked) count++; });
        
        if (count > maxLurers) {
            checkbox.checked = false;
            alert(`Você só pode selecionar ${maxLurers} Lurers no Modo ${currentMode}.`);
        }
    }

    function limparDados() {
        for(let i = 1; i <= 6; i++) {
            const nomeInput = document.getElementById(`nome${i}`);
            const danoInput = document.getElementById(`dano${i}`);
            const lurerCheck = document.getElementById(`lurer${i}`);
            
            if(nomeInput) nomeInput.value = '';
            if(danoInput) danoInput.value = '';
            if(lurerCheck) lurerCheck.checked = false;
        }
        
        document.getElementById('nick').value = '';
        document.getElementById('donate').value = '0';
        document.getElementById('dailys').value = '0';
        document.getElementById('results').style.display = 'none';
    }

    function calcularHunt() {
        const pokes = [];
        let lurerCount = 0;
        
        for (let i = 1; i <= 6; i++) {
            const nome = document.getElementById(`nome${i}`).value || `Pokémon ${i}`;
            const dano = parseFloat(document.getElementById(`dano${i}`).value) || 0;
            const isLurer = document.getElementById(`lurer${i}`).checked;
            if (isLurer) lurerCount++;
            pokes.push({ nome, dano, isLurer });
        }

        const lurers = pokes.filter(p => p.isLurer);
        const nonLurers = pokes.filter(p => !p.isLurer);
        const res = document.getElementById('results');
        let html = '';

        if (currentMode === '3x3') {
            if (lurerCount !== 2) {
                alert('Erro: Selecione exatamente 2 Lurers para gerar os trios.');
                return;
            }
            
            // ALGORITMO BALANCEAMENTO 3x3
            let bestDiff = Infinity;
            let bestTeam1 = [], bestTeam2 = [];
            
            // Combinações de 2 para o trio 1 (6 possíveis combinações)
            const combs = [[0,1], [0,2], [0,3], [1,2], [1,3], [2,3]];
            for (let c of combs) {
                const t1_nl = [nonLurers[c[0]], nonLurers[c[1]]];
                const t2_nl = nonLurers.filter((_, idx) => !c.includes(idx));

                const dmg1 = lurers[0].dano + t1_nl[0].dano + t1_nl[1].dano;
                const dmg2 = lurers[1].dano + t2_nl[0].dano + t2_nl[1].dano;
                const diff = Math.abs(dmg1 - dmg2);

                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestTeam1 = [lurers[0], ...t1_nl];
                    bestTeam2 = [lurers[1], ...t2_nl];
                }
            }

            html += `<h3 style="text-align: center; margin-top: 0;">Times Balanceados (3x3)</h3>`;
            html += renderTeam(bestTeam1, "Trio 1 (Líder: " + lurers[0].nome + ")");
            html += renderTeam(bestTeam2, "Trio 2 (Líder: " + lurers[1].nome + ")");

        } else if (currentMode === '2x2') {
            if (lurerCount !== 3) {
                alert('Erro: Selecione exatamente 3 Lurers para gerar as duplas.');
                return;
            }
            
            // ALGORITMO BALANCEAMENTO 2x2
            let bestDiff = Infinity;
            let bestTeams = [];
            
            // Permutações dos não-lurers (6 permutações)
            const perms = [[0,1,2], [0,2,1], [1,0,2], [1,2,0], [2,0,1], [2,1,0]];
            for (let p of perms) {
                const dmg1 = lurers[0].dano + nonLurers[p[0]].dano;
                const dmg2 = lurers[1].dano + nonLurers[p[1]].dano;
                const dmg3 = lurers[2].dano + nonLurers[p[2]].dano;

                const maxDmg = Math.max(dmg1, dmg2, dmg3);
                const minDmg = Math.min(dmg1, dmg2, dmg3);
                const diff = maxDmg - minDmg;

                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestTeams = [
                        [lurers[0], nonLurers[p[0]]],
                        [lurers[1], nonLurers[p[1]]],
                        [lurers[2], nonLurers[p[2]]]
                    ];
                }
            }

            html += `<h3 style="text-align: center; margin-top: 0;">Times Balanceados (2x2)</h3>`;
            html += renderTeam(bestTeams[0], "Dupla 1 (Líder: " + lurers[0].nome + ")");
            html += renderTeam(bestTeams[1], "Dupla 2 (Líder: " + lurers[1].nome + ")");
            html += renderTeam(bestTeams[2], "Dupla 3 (Líder: " + lurers[2].nome + ")");
        }

        res.innerHTML = html;
        res.style.display = 'block';
    }

    function renderTeam(team, title) {
        let dmgBase = team.reduce((sum, p) => sum + p.dano, 0);
        let dmgPrey = dmgBase * 1.30;
        const meta = 750;
        
        let html = `<div class="team-card">`;
        html += `<h4 style="margin-top: 0; color: #e3350d; border-bottom: 2px solid #ccc; padding-bottom: 5px;">🏆 ${title}</h4>`;
        html += `<ul style="list-style:none; padding-left:0; margin-top:5px; font-size: 0.9rem;">`;
        team.forEach(p => {
            html += `<li style="margin-bottom: 5px;">${p.isLurer ? '🎯 <strong>Lurer</strong>' : '⚔️ <strong>Ataque</strong>'} - ${p.nome}: <span style="color:#0000ff">${p.dano}</span></li>`;
        });
        html += `</ul>`;
        html += `<div style="margin-top: 10px; font-size: 0.9rem;">`;
        html += `<strong>Dano Total (Base):</strong> ${dmgBase.toFixed(1)} <br>`;
        html += `<strong>Dano Total (+30% Prey):</strong> ${dmgPrey.toFixed(1)} <br><br>`;
        
        if (dmgBase >= meta) {
            html += `<span class="pass">✅ Este time pode caçar sem Prey!</span>`;
        } else if (dmgPrey >= meta) {
            html += `<span class="pass">✅ Este time pode caçar com Prey!</span>`;
        } else {
            html += `<span class="fail">❌ Time muito fraco. Faltou ${(meta - dmgPrey).toFixed(1)} de dano (Mesmo com Prey).</span>`;
        }
        
        html += `</div></div>`;
        return html;
    }

    function calcularContrib() {
        const meta = 5400;
        const donate = parseFloat(document.getElementById('donate').value) || 0;
        const dailys = parseFloat(document.getElementById('dailys').value) || 0;
        
        const totalDaily = dailys * 300;
        const totalFinal = donate + totalDaily;
        
        const res = document.getElementById('results');
        res.style.display = 'block';

        let html = `<h3 style="margin-top: 0; text-align: center;">Resumo da Contribuição</h3>`;
        html += `<div class="result-line">📜 Valor por Dailys: <span class="highlight">${totalDaily}</span></div>`;
        html += `<div class="result-line">💰 Valor Donate: <span class="highlight">${donate}</span></div>`;
        html += `<div class="result-line" style="border-bottom: 3px solid #1a1a1a;">🏆 Total Acumulado: <span class="highlight">${totalFinal}</span></div>`;

        if (totalFinal >= meta) {
            html += `<div class="result-line pass" style="text-align: center; font-size: 1.2rem;">OK ✅<br><span style="font-size:0.8rem">Meta batida!</span></div>`;
        } else {
            const devendo = meta - totalFinal;
            html += `<div class="result-line fail" style="text-align: center; font-size: 1.1rem;">⚠️ Devendo: R$ -${devendo.toFixed(2)}</div>`;
        }
        res.innerHTML = html;
    }
</script>
</body>
</html>
